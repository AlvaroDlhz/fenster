# Fenster + picom v12 — animaciones con el ritmo de Dock-e.
# Requiere picom >= 12 (scripts/build-picom.sh). Tiempos de src/style.vala,
# tomados del tema "Navbar" de Dock-e.
#
# Fenster marca cada ventana con _FENSTER_ANIM justo antes de mostrarla u
# ocultarla, para que picom sepa POR QUÉ ocurre:
#   desk-next / desk-prev  cambio de escritorio (deslizar a izq./der.)
#   minimize               minimizar / restaurar (animado por Fenster)
# Sin marca: abrir / cerrar normales.
#
# NOTA: borrador sin probar con picom v12 real (el equipo tiene v10).
# Ajustar presets y direcciones al instalarlo.

backend = "glx";
vsync = true;

# --- Cristal solo en la barra (como la configuración actual) ---
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [
  "window_type != 'dock'",
  "class_g = 'Plank'",
  "class_g = 'Dock-e'"
];

shadow = false;
corner-radius = 12;            # TopRoundness / BottomRoundness de Dock-e

# Animaciones por defecto: abrir y cerrar ventanas
animations = (
  # Abrir: aparece y crece 95% → 100%  (ItemMoveTime 230 ms)
  { triggers = [ "open", "show" ];
    preset = "appear"; duration = 0.23; scale = 0.95; },

  # Cerrar: se desvanece y encoge  (HideTime 120 ms)
  { triggers = [ "close", "hide" ];
    preset = "disappear"; duration = 0.12; scale = 0.95; },

  # Maximizar / ajustar / mover entre monitores  (ActiveTime 300 ms)
  { triggers = [ "geometry" ];
    preset = "geometry-change"; duration = 0.30; }
);

rules = (
  # Docks, panel y escritorio: sin esquinas ni animaciones propias
  { match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0; animations = (); },

  { match = "fullscreen"; corner-radius = 0; },

  # Alt+Tab de Fenster: dibuja sus propias esquinas (18 px); entrada rápida
  { match = "class_g = 'Fenster'";
    corner-radius = 0;
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; duration = 0.12; scale = 0.97; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.08; scale = 0.97; }
    ); },

  # Cambio de escritorio hacia la derecha: lo viejo sale por la izquierda
  { match = "_FENSTER_ANIM@:s = 'desk-next'";
    animations = (
      { triggers = [ "hide" ]; preset = "slide-out"; direction = "left"; duration = 0.30; },
      { triggers = [ "show" ]; preset = "slide-in"; direction = "right"; duration = 0.30; }
    ); },

  # Cambio de escritorio hacia la izquierda
  { match = "_FENSTER_ANIM@:s = 'desk-prev'";
    animations = (
      { triggers = [ "hide" ]; preset = "slide-out"; direction = "right"; duration = 0.30; },
      { triggers = [ "show" ]; preset = "slide-in"; direction = "left"; duration = 0.30; }
    ); },

  # Minimizar / restaurar: lo anima Fenster (encoger y desvanecer en el sitio)
  { match = "_FENSTER_ANIM@:s = 'minimize'"; animations = (); },

  # Captura animada de Fenster: sin esquinas ni animación de picom encima
  { match = "class_g = 'Fenster' && class_i = 'fenster-minimize'";
    corner-radius = 0; animations = (); }
);
